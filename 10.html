<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What is Happening? - English Quiz for Kids</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .quiz-container {
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    padding: 30px;
    max-width: 780px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  h1 {
    text-align: center;
    color: #ff6b9d;
    font-size: 1.9rem;
    margin-bottom: 15px;
    text-shadow: 2px 2px 0 #ffe0eb;
  }
  .score-board {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff3cd;
    border-radius: 20px;
    padding: 12px 20px;
    margin-bottom: 15px;
    font-size: 1.15rem;
    font-weight: bold;
    color: #856404;
    border: 3px dashed #ffd93d;
  }
  .score-board span { display: flex; align-items: center; gap: 5px; }
  .question-counter {
    background: #d4edda;
    color: #155724;
    padding: 5px 15px;
    border-radius: 15px;
    font-size: 0.9rem;
  }

  /* ==== SAHNE ==== */
  .scene {
    background: linear-gradient(180deg, #cceeff 0%, #e6f7ff 60%, #d4f1d4 100%);
    border-radius: 25px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #a8edea;
  }
  .scene::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55px;
    background: linear-gradient(180deg, #b8e994 0%, #78c850 100%);
    border-radius: 0 0 20px 20px;
  }
  .scene.night {
    background: linear-gradient(180deg, #1a237e 0%, #283593 60%, #3949ab 100%);
    border-color: #5c6bc0;
  }
  .scene.night::after {
    background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
  }
  .scene.rainy {
    background: linear-gradient(180deg, #78909c 0%, #b0bec5 60%, #cfd8dc 100%);
    border-color: #607d8b;
  }
  .scene.rainy::after {
    background: linear-gradient(180deg, #7cb342 0%, #558b2f 100%);
  }
  .scene.indoor {
    background: linear-gradient(180deg, #ffecb3 0%, #ffe082 60%, #ffcc80 100%);
    border-color: #ffb74d;
  }
  .scene.indoor::after {
    background: linear-gradient(180deg, #a1887f 0%, #8d6e63 100%);
  }
  .scene.space {
    background: radial-gradient(circle at 50% 50%, #311b92 0%, #1a0033 100%);
    border-color: #7e57c2;
  }
  .scene.space::after { background: #000; height: 0; }

  .sun {
    position: absolute;
    top: 15px; right: 25px;
    width: 55px; height: 55px;
    background: radial-gradient(circle, #ffe066, #ffb800);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(255, 200, 0, 0.6);
    animation: sunPulse 3s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .moon {
    position: absolute;
    top: 15px; right: 25px;
    width: 45px; height: 45px;
    background: radial-gradient(circle at 35% 35%, #fff9c4, #fbc02d);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(255, 235, 59, 0.7);
  }
  .star {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .cloud {
    position: absolute;
    top: 30px; left: -60px;
    width: 70px; height: 30px;
    background: #fff;
    border-radius: 30px;
    opacity: 0.85;
    animation: cloudMove 12s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud::before { width: 35px; height: 35px; top: -15px; left: 10px; }
  .cloud::after  { width: 25px; height: 25px; top: -10px; left: 38px; }
  @keyframes cloudMove {
    0% { left: -80px; }
    100% { left: 110%; }
  }
  .rain {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .raindrop {
    position: absolute;
    width: 2px; height: 15px;
    background: linear-gradient(180deg, transparent, #4fc3f7);
    animation: rainFall 1s linear infinite;
    opacity: 0.7;
  }
  @keyframes rainFall {
    0% { transform: translateY(-20px); }
    100% { transform: translateY(280px); }
  }

  .character {
    position: relative;
    z-index: 2;
    transition: transform 0.3s;
  }

  /* Animasyonlar */
  @keyframes runBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .char-running { animation: runBob 0.5s ease-in-out infinite; }

  @keyframes fly {
    0%, 100% { transform: translateY(-10px) rotate(-3deg); }
    50% { transform: translateY(5px) rotate(3deg); }
  }
  .char-flying { animation: fly 1.8s ease-in-out infinite; }

  @keyframes swim {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  .char-swimming { animation: swim 1.6s ease-in-out infinite; }

  @keyframes sitSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }
  .char-sitting { animation: sitSway 2s ease-in-out infinite; }

  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-30px); }
    60% { transform: translateY(-30px); }
  }
  .char-jumping { animation: jump 1s ease-in-out infinite; }

  @keyframes sleepBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  .char-sleeping { animation: sleepBreathe 2.5s ease-in-out infinite; }

  @keyframes eatNod {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-6deg); }
  }
  .char-eating { animation: eatNod 0.8s ease-in-out infinite; }

  @keyframes danceMove {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(8deg) translateY(-5px); }
  }
  .char-dancing { animation: danceMove 0.6s ease-in-out infinite; }

  @keyframes readStill {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .char-reading { animation: readStill 3s ease-in-out infinite; }

  @keyframes driveVibrate {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .char-driving { animation: driveVibrate 0.3s ease-in-out infinite; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-15px) scale(1.05); }
  }
  .char-bouncing { animation: bounce 0.7s ease-in-out infinite; }

  @keyframes waveHand {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-20deg); }
  }
  .char-waving { animation: sitSway 2s ease-in-out infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(-5px); }
    50% { transform: translateY(5px); }
  }
  .char-floating { animation: float 2.5s ease-in-out infinite; }

  .zzz {
    position: absolute;
    top: 10px; right: 20px;
    font-size: 1.5rem;
    color: #6c5ce7;
    animation: zzzFloat 2s ease-in-out infinite;
    font-weight: bold;
  }
  .zzz:nth-child(2) { animation-delay: 0.6s; font-size: 1.2rem; }
  .zzz:nth-child(3) { animation-delay: 1.2s; font-size: 1rem; }
  @keyframes zzzFloat {
    0% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); }
  }

  .water-waves {
    position: absolute;
    bottom: 40px; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(180deg, transparent 0%, #4fc3f7 40%, #0288d1 100%);
    opacity: 0.85;
    z-index: 1;
  }

  /* Soru metni */
  .question-text {
    font-size: 1.35rem;
    color: #333;
    text-align: center;
    margin-bottom: 18px;
    padding: 14px;
    background: #f8f9fa;
    border-radius: 15px;
    border: 3px solid #e9ecef;
    line-height: 1.6;
    flex-wrap: wrap;
  }

  .clickable-word {
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 8px;
    transition: all 0.2s;
    border-bottom: 3px dotted #ff6b9d;
    color: #4a4a4a;
    background: transparent;
    font: inherit;
    display: inline-block;
  }
  .clickable-word:hover, .clickable-word:focus {
    background: #ffe0eb;
    transform: scale(1.05);
    outline: 3px solid #ff6b9d;
    outline-offset: 2px;
  }
  .clickable-word.used-1 { background: #fff3cd; border-bottom-color: #ffc107; }
  .clickable-word.used-2 { background: #ffe5b4; border-bottom-color: #fd7e14; }
  .clickable-word.used-3 { background: #ffd0d0; border-bottom-color: #dc3545; }
  .clickable-word.used-4 { background: #d3d3d3; border-bottom-color: #6c757d; }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .option-btn {
    padding: 18px 14px;
    font-size: 1.05rem;
    font-family: inherit;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    background: linear-gradient(145deg, #a8e6cf, #7fcdb8);
    color: #fff;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: 0 5px 0 #5ba899;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    text-align: left;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 8px 0 #5ba899;
  }
  .option-btn:focus-visible {
    outline: 4px solid #ff6b9d;
    outline-offset: 3px;
  }
  .option-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 3px 0 #5ba899;
  }
  .option-btn:disabled { cursor: not-allowed; opacity: 0.75; }

  .option-btn.correct {
    background: linear-gradient(145deg, #7bed9f, #2ed573);
    box-shadow: 0 5px 0 #1e9e54, 0 0 0 0 rgba(46, 213, 115, 0.7);
    animation: gentleCorrect 600ms ease-out forwards;
  }
  @keyframes gentleCorrect {
    0%   { transform: scale(1);    box-shadow: 0 5px 0 #1e9e54, 0 0 0 0 rgba(46,213,115,0.7); }
    40%  { transform: scale(1.04); box-shadow: 0 5px 0 #1e9e54, 0 0 0 14px rgba(46,213,115,0); }
    100% { transform: scale(1);    box-shadow: 0 5px 0 #1e9e54, 0 0 0 0 rgba(46,213,115,0); }
  }
  .option-btn.wrong {
    background: linear-gradient(145deg, #ff7979, #eb4d4b);
    box-shadow: 0 5px 0 #b33939;
    animation: softShake 400ms ease;
  }
  @keyframes softShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .option-btn.correct, .option-btn.wrong,
    .confetti, .sun, .cloud, .raindrop, .star,
    .char-running, .char-flying, .char-swimming,
    .char-sitting, .char-jumping, .char-sleeping,
    .char-eating, .char-dancing, .char-reading,
    .char-driving, .char-bouncing, .char-waving,
    .char-floating, .zzz { animation: none !important; }
  }

  .feedback {
    text-align: center;
    font-size: 1.35rem;
    font-weight: bold;
    margin-top: 18px;
    min-height: 38px;
  }
  .feedback.correct { color: #2ed573; }
  .feedback.wrong { color: #eb4d4b; }

  .next-btn {
    display: block;
    margin: 18px auto 0;
    padding: 14px 40px;
    font-size: 1.15rem;
    font-family: inherit;
    background: linear-gradient(145deg, #ffb347, #ff8c00);
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 5px 0 #cc7000;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    transition: all 0.2s;
  }
  .next-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #cc7000; }
  .next-btn:focus-visible { outline: 4px solid #ff6b9d; outline-offset: 3px; }
  .next-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #cc7000; }

  .word-tooltip {
    position: fixed;
    background: #222;
    color: #fff;
    padding: 14px 18px;
    border-radius: 15px;
    font-size: 1.05rem;
    max-width: 300px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    z-index: 1000;
    display: none;
    line-height: 1.5;
    border: 3px solid #ff6b9d;
  }
  .word-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 10px solid transparent;
    border-top-color: #ff6b9d;
  }
  .word-tooltip .word-title {
    color: #ffd93d;
    font-weight: bold;
    font-size: 1.15rem;
    margin-bottom: 6px;
    display: block;
  }

  .confetti {
    position: absolute;
    font-size: 2rem;
    animation: fall 1.4s ease-out forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes fall {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
  }

  .final-screen { text-align: center; padding: 20px; }
  .final-screen h2 { font-size: 2.2rem; color: #ff6b9d; margin-bottom: 20px; }
  .final-screen .final-score {
    font-size: 3rem; color: #2ed573; font-weight: bold;
    margin: 20px 0; text-shadow: 3px 3px 0 #d4edda;
  }
  .final-screen .message { font-size: 1.3rem; color: #555; margin: 15px 0 25px; }
  .final-screen .stats {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 15px;
    margin: 15px auto;
    max-width: 400px;
    border: 3px solid #e9ecef;
    font-size: 1.05rem;
    color: #555;
  }
  .restart-btn {
    padding: 15px 40px; font-size: 1.2rem; font-family: inherit;
    background: linear-gradient(145deg, #a29bfe, #6c5ce7);
    color: white; border: none; border-radius: 20px; cursor: pointer;
    font-weight: bold; box-shadow: 0 5px 0 #4834d4; transition: all 0.2s;
  }
  .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #4834d4; }
  .restart-btn:focus-visible { outline: 4px solid #ff6b9d; outline-offset: 3px; }

  .score-popup {
    position: fixed; top: 30%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 4rem; font-weight: bold; color: #2ed573;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 #2ed573;
    z-index: 2000; pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  .score-popup.show { transform: translate(-50%, -50%) scale(1); }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 560px) {
    .options { grid-template-columns: 1fr; }
    h1 { font-size: 1.5rem; }
    .scene { min-height: 220px; }
    .option-btn { font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="quiz-container" id="quizContainer" role="main"></div>

<div class="word-tooltip"
     id="wordTooltip"
     role="tooltip"
     aria-live="polite"
     aria-atomic="true">
  <span class="word-title" id="tooltipTitle"></span>
  <span class="word-desc" id="tooltipDesc"></span>
</div>

<div id="srAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<div class="score-popup" id="scorePopup" aria-hidden="true"></div>

<script>
// ================================================================
// QUIZ DATA — 15 SAHNE
// ================================================================
const quizData = [

  // 1) KOŞAN KÖPEK
  {
    sceneSVG: `

    correct: 1,
    optionWords: {

      "running": "Koşuyor - hızlı yürümek",

      "sea": "Deniz - büyük tuzlu su"
    }
  },

  // 2) UÇAN KUŞ
  {
    sceneSVG: `
      <svg viewBox="0 0 300 220" width="280" height="200" aria-hidden="true">
        <g class="char-flying" style="transform-origin:150px 110px">
          <ellipse cx="150" cy="115" rx="40" ry="25" fill="#4fc3f7"/>
          <circle cx="190" cy="95" r="22" fill="#4fc3f7"/>
          <circle cx="198" cy="90" r="4" fill="#222"/>
          <circle cx="199" cy="89" r="1.5" fill="#fff"/>
          <path d="M208 95 L225 98 L208 103 Z" fill="#ffa726"/>
          <path d="M120 100 Q100 70 140 85 Z" fill="#29b6f6"/>

          <path d="M110 115 L85 105 L85 125 Z" fill="#0288d1"/>

        <path d="M50 100 Q80 95 110 100" stroke="#bbb" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.6"/>
        <path d="M40 140 Q75 135 105 140" stroke="#bbb" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.5"/>

    `,
    question: "Look at the picture. What is the bird doing?",
    words: {
      "bird": "Kuş - uçan tüylü hayvan",
      "doing": "Yapıyor - bir eylem gerçekleştirmek"
    },
    options: [
      "The bird is flying in the sky.",
      "The bird is sitting on a tree.",
      "The bird is eating a worm.",
      "The bird is swimming in a lake."
    ],
    correct: 0,
    optionWords: {
      "flying": "Uçuyor - havada hareket etmek",
      "sky": "Gökyüzü - yukarıdaki mavi alan",
      "sitting": "Oturuyor - bir yere yerleşmek",
      "tree": "Ağaç - yapraklı uzun bitki",
      "eating": "Yiyor - yemek yemek",
      "worm": "Solucan - toprakta yaşayan uzun canlı",
      "swimming": "Yüzüyor - suda hareket etmek",
      "lake": "Göl - küçük durgun su"
    }
  },

  // 3) UYUYAN KEDİ
  {
    sceneSVG: `
      <svg viewBox="0 0 300 220" width="280" height="200" aria-hidden="true">

      "big": "Büyük - boyutu fazla olan",
      "tree": "Ağaç - yapraklı uzun bitki"
    }
  }
];

// ================================================================
// STATE
// ================================================================
let currentQuestion = 0;
let totalScore = 0;
let wordUsage = {};
let answered = false;
let questionScore = 10;
let tooltipTimer = null;
let stats = { perfect: 0, usedHint: 0, wrong: 0 };

const container     = document.getElementById('quizContainer');
const tooltip       = document.getElementById('wordTooltip');
const tooltipTitle  = document.getElementById('tooltipTitle');
const tooltipDesc   = document.getElementById('tooltipDesc');
const scorePopup    = document.getElementById('scorePopup');
const srAnnouncer   = document.getElementById('srAnnouncer');

// ================================================================
// AUDIO
// ================================================================
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playCorrectSound() {
  const ctx = getAudioContext();
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    const t = ctx.currentTime + i * 0.1;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.3);
  });
}
function playWrongSound() {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(280, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
}
function playClickSound() {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = 700;
  gain.gain.setValueAtTime(0.12, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
}

// ================================================================
// SPEECH
// ================================================================
function speakWord(word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}
function announce(text) {
  srAnnouncer.textContent = '';
  setTimeout(() => { srAnnouncer.textContent = text; }, 50);
}

// ================================================================
// KELİME TIKLAMA
// ================================================================
function handleWordClick(word, wordData, element) {
  if (answered) return;
  if (!wordUsage[currentQuestion]) wordUsage[currentQuestion] = {};
  const count = (wordUsage[currentQuestion][word] || 0) + 1;
  wordUsage[currentQuestion][word] = count;

  if (count === 1) questionScore = Math.min(questionScore, 5);
  else if (count === 2) questionScore = Math.min(questionScore, 2.5);
  else if (count === 3) questionScore = Math.min(questionScore, 1);
  else questionScore = 0;

  tooltipTitle.textContent = '📖 ' + word;
  tooltipDesc.textContent = wordData;

  const rect = element.getBoundingClientRect();
  tooltip.style.display = 'block';
  const tipW = 300;
  let left = rect.left + rect.width / 2 - tipW / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - tipW - 10));
  let top = rect.bottom + 15;
  if (top + 120 > window.innerHeight) top = rect.top - 130;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';

  speakWord(word);
  element.className = 'clickable-word used-' + Math.min(count, 4);

  announce(`${word}. ${wordData}`);
  playClickSound();

  clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(() => { tooltip.style.display = 'none'; }, 5000);
}

function makeSentenceClickable(sentence, wordDict) {
  return sentence.split(' ').map(word => {
    const clean = word.replace(/[.,!?'"]/g, '');
    const key = wordDict[clean] ? clean : (wordDict[clean.toLowerCase()] ? clean.toLowerCase() : null);
    if (key) {
      return `<button type="button"
                class="clickable-word"
                data-word="${clean}"
                data-key="${key}"
                aria-label="${clean}"
              >${word}</button>`;
    }
    return word;
  }).join(' ');
}

// ================================================================
// SORUYU ÇİZ
// ================================================================
function renderQuestion() {
  answered = false;
  questionScore = 10;
  if (!wordUsage[currentQuestion]) wordUsage[currentQuestion] = {};

  const q = quizData[currentQuestion];

  // Sahne class
  let sceneClass = '';
  if (q.sceneClass) sceneClass += ' ' + q.sceneClass;
  const isNight = q.sceneClass === 'night' || q.sceneClass === 'space';
  const isRainy = q.sceneClass === 'rainy';

  // Güneş/Ay
  const sunHTML = isNight ? '<div class="moon"></div>' : (isRainy ? '' : '<div class="sun"></div>');

  // Bulut (sadece açık havalarda)
  const cloudHTML = (!isNight && !isRainy) ? '<div class="cloud"></div>' : '';

  // Su sahnesi ekleri
  const sceneExtra = q.sceneClass === 'with-water' ? '<div class="water-waves"></div>' : '';

  const questionHTML = makeSentenceClickable(q.question, q.words);

  const optionsHTML = q.options.map((opt, i) => {
    const sentenceHTML = makeSentenceClickable(opt, q.optionWords);
    return `<button class="option-btn" data-index="${i}" aria-label="${opt}">
              ${sentenceHTML}
            </button>`;
  }).join('');

  // Progress bar
  const progressPercent = ((currentQuestion) / quizData.length) * 100;

  container.innerHTML = `
    <h1>🌟 What is Happening? 🌟</h1>
    <div class="score-board">
      <span>⭐ Score: <span id="scoreDisplay" aria-live="polite">${totalScore}</span></span>
      <span class="question-counter">Question ${currentQuestion + 1} / ${quizData.length}</span>
    </div>

    <div class="scene${sceneClass}" id="scene">
      ${sunHTML}
      ${cloudHTML}
      ${sceneExtra}
      <div class="character">${q.sceneSVG}</div>
    </div>

    <div class="question-text" id="questionText">${questionHTML}</div>

    <div class="options" id="optionsContainer" role="group" aria-label="Answer choices">
      ${optionsHTML}
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <button class="next-btn" id="nextBtn" style="display:none;">Next ➡️</button>
  `;

  document.querySelectorAll('.clickable-word').forEach(el => {
    const w = el.dataset.word;
    const c = wordUsage[currentQuestion][w] || 0;
    if (c > 0) el.className = 'clickable-word used-' + Math.min(c, 4);
  });

  document.querySelectorAll('.clickable-word').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const w = el.dataset.word;
      const key = el.dataset.key || w;
      const dict = el.closest('.question-text') ? q.words : q.optionWords;
      const data = dict[key] || dict[w.toLowerCase()] || '';
      if (data) handleWordClick(key, data, el);
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (e.target.classList.contains('clickable-word')) return;
      handleAnswer(parseInt(btn.dataset.index));
    });
  });

  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  announce(`Question ${currentQuestion + 1} of ${quizData.length}. ${q.question}`);
}

// ================================================================
// CEVAP KONTROL
// ================================================================
function handleAnswer(index) {
  if (answered) return;
  answered = true;

  const q = quizData[currentQuestion];
  const buttons = document.querySelectorAll('.option-btn');
  const feedback = document.getElementById('feedback');

  buttons.forEach(b => b.disabled = true);

  if (index === q.correct) {
    buttons[index].classList.add('correct');
    playCorrectSound();
    const earned = questionScore;
    totalScore += earned;
    document.getElementById('scoreDisplay').textContent = totalScore;
    if (earned === 10) stats.perfect++;
    else if (earned > 0) stats.usedHint++;
    feedback.textContent = `🎉 Great job! +${earned} points!`;
    feedback.className = 'feedback correct';
    showScorePopup('+' + earned);
    launchConfetti();
    speakWord(q.options[q.correct]);
    announce(`Correct! ${q.options[q.correct]}. You earned ${earned} points. Total score: ${totalScore}.`);
  } else {
    buttons[index].classList.add('wrong');
    buttons[q.correct].classList.add('correct');
    playWrongSound();
    stats.wrong++;
    feedback.textContent = `😊 Oops! The correct answer is: "${q.options[q.correct]}"`;
    feedback.className = 'feedback wrong';
    setTimeout(() => speakWord(q.options[q.correct]), 400);
    announce(`Wrong answer. The correct answer is: ${q.options[q.correct]}.`);
  }

  document.getElementById('nextBtn').style.display = 'block';
}

// ================================================================
// PUAN POPUP + KONFETİ
// ================================================================
function showScorePopup(text) {
  scorePopup.textContent = text;
  scorePopup.classList.add('show');
  setTimeout(() => scorePopup.classList.remove('show'), 900);
}
function launchConfetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const emojis = ['🎉', '⭐', '🌟', '✨'];
  for (let i = 0; i < 8; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    conf.setAttribute('aria-hidden', 'true');
    conf.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    conf.style.left = (10 + Math.random() * 80) + '%';
    conf.style.top = '-30px';
    conf.style.animationDelay = (Math.random() * 0.3) + 's';
    conf.style.fontSize = (1.3 + Math.random() * 0.8) + 'rem';
    container.appendChild(conf);
    setTimeout(() => conf.remove(), 1800);
  }
}

// ================================================================
// SONRAKİ SORU
// ================================================================
function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= quizData.length) renderFinalScreen();
  else renderQuestion();
}

// ================================================================
// FİNAL
// ================================================================
function renderFinalScreen() {
  const maxScore = quizData.length * 10;
  let message = '';
  let medal = '';
  if (totalScore >= maxScore * 0.8) { message = '🏆 Excellent! You are a superstar!'; medal = '🥇'; }
  else if (totalScore >= maxScore * 0.5) { message = '🌟 Very good! Keep learning!'; medal = '🥈'; }
  else { message = '💪 Good try! Practice makes perfect!'; medal = '🥉'; }

  container.innerHTML = `
    <div class="final-screen">
      <h2>🎊 Quiz Complete! 🎊</h2>
      <div style="font-size:4rem;">${medal}</div>
      <div class="final-score">${totalScore} / ${maxScore}</div>
      <div class="message">${message}</div>
      <div class="stats">
        <div>✅ Perfect answers: <strong>${stats.perfect}</strong></div>
        <div>💡 Used hints: <strong>${stats.usedHint}</strong></div>
        <div>❌ Wrong answers: <strong>${stats.wrong}</strong></div>
      </div>
      <button class="restart-btn" id="restartBtn">🔄 Play Again</button>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', () => {
    currentQuestion = 0; totalScore = 0; wordUsage = {};
    stats = { perfect: 0, usedHint: 0, wrong: 0 };
    renderQuestion();
  });

  launchConfetti();
  playCorrectSound();
  announce(`Quiz complete. Your total score is ${totalScore} out of ${maxScore}. ${message}`);
}

// ================================================================
// DIŞ TIKLAMA / ESC
// ================================================================
document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('clickable-word') && !tooltip.contains(e.target)) {
    tooltip.style.display = 'none';
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') tooltip.style.display = 'none';
});

// ================================================================
// BAŞLAT
// ================================================================
renderQuestion();
</script>
</body>
</html>
