<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Geniş Zaman Quiz Kütüphanesi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; }
        .nav-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        
        /* Butonlar başlangıçta gizlidir, sadece klasörde olanlar açılacak */
        .tab-btn { display: none; padding: 12px 24px; border: none; background: #e0e0e0; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .tab-btn:hover { background: #bbb; }
        .tab-btn.active { background: #007bff; color: white; }
        
        .quiz-container { display: none; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 85vh; border: none; }
    </style>
</head>
<body>

    <h2 style="text-align:center; color:#333; margin-bottom: 25px;">İngilizce Geniş Zaman Quizleri</h2>
    
    <div class="nav-tabs" id="buttonArea"></div>
    <div id="quizArea"></div>

    <script>
        const buttonArea = document.getElementById('buttonArea');
        const quizArea = document.getElementById('quizArea');
        
        // 1. ADIM: 1'den 100'e kadar olan tüm HTML yuvalarını hafızada sırayla oluşturuyoruz.
        // Bu sayede butonların HTML içindeki fiziksel sırası (1, 2, 3...) asla bozulamaz.
        for (let i = 1; i <= 100; i++) {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.id = `btn_q${i}`;
            btn.innerText = `Quiz ${i}`;
            btn.onclick = (e) => openQuiz(`q${i}`, e.currentTarget);
            buttonArea.appendChild(btn);

            const div = document.createElement('div');
            div.id = `q${i}`;
            div.className = 'quiz-container';
            div.innerHTML = `<iframe src="${i}.html"></iframe>`;
            quizArea.appendChild(div);
        }

        // 2. ADIM: Tüm kontroller bittikten sonra ilk quizi sıraya göre açmak için dizi hazırlıyoruz
        const mevcutQuizler = [];
        let tamamlananKontrol = 0;

        for (let i = 1; i <= 100; i++) {
            const dosyaAdi = `${i}.html`;

            fetch(dosyaAdi, { method: 'HEAD' })
            .then(res => {
                if (res.ok) {
                    // Dosya varsa butonunu görünür yap. Buton HTML'de zaten doğru sırada 
                    // beklediği için hangisi önce yanıt verirse versin yerleşim sırası ŞASMAZ!
                    document.getElementById(`btn_q${i}`).style.display = 'block';
                    mevcutQuizler.push(i);
                }
                aksiyonKontrol();
            })
            .catch(() => {
                // Dosya yoksa veya silinmişse buton gizli kalmaya devam eder
                aksiyonKontrol();
            });
        }

        // 3. ADIM: 100 dosyanın tamamı tarandığı an en küçük numaralı mevcut quizi hatasız açar
        function aksiyonKontrol() {
            tamamlananKontrol++;
            if (tamamlananKontrol === 100 && mevcutQuizler.length > 0) {
                // Mevcut numaraları küçükten büyüğe sırala (Garanti yöntem)
                mevcutQuizler.sort((a, b) => a - b);
                
                const enKucukQuizNo = mevcutQuizler[0];
                const ilkQuizId = `q${enKucukQuizNo}`;
                
                // En küçük numaralı mevcut quizi ve butonunu aktif et
                document.getElementById(ilkQuizId).style.display = 'block';
                document.getElementById(`btn_${ilkQuizId}`).classList.add('active');
            }
        }

        function openQuiz(quizId, clickedBtn) {
            document.querySelectorAll('.quiz-container').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(quizId).style.display = 'block';
            clickedBtn.classList.add('active');
        }
    </script>
</body>
</html>
